[project]
name = "review-agent"
version = "1.0.0"
description = "AI-powered code review system for GitLab"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["gitlab", "code-review", "ai", "llm", "pr-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "django>=4.2,<5.0",
    "djangorestframework>=3.14",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "dynaconf>=3.2.0",
    "psycopg2-binary>=2.9.0",
    "redis>=4.5.0",
    "celery[redis]>=5.3.0",
    "python-gitlab>=4.0.0",
    "litellm>=1.40.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyjwt>=2.8.0",
    "structlog>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-django>=4.5.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/your-org/review-agent"
Documentation = "https://github.com/your-org/review-agent#readme"
Repository = "https://github.com/your-org/review-agent.git"
Issues = "https://github.com/your-org/review-agent/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[[tool.mypy.overrides]]
module = "gitlab.*,litellm.*,celery.*"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "settings.development"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "settings.development"
python_files = ["test_*.py"]
testpaths = ["backend"]
