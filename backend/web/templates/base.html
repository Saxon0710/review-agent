<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
{% load static %}
<div class="app-wrapper">
    <!-- 移动端遮罩层 -->
    <div class="sidebar-overlay"></div>

    <!-- 侧边栏 -->
    <aside class="sidebar-container">
        <!-- Logo -->
        <div class="sidebar-logo">
            <span class="logo-text">Review Agent</span>
        </div>

        <!-- 菜单 -->
        <nav class="sidebar-menu">
            <div class="menu-item {% if request.path == '/' %}active{% endif %}"
                 data-url="/" data-title="仪表板" data-icon="bi-speedometer2" data-closable="false">
                <i class="bi bi-speedometer2"></i>
                <span>仪表板</span>
            </div>
            <div class="menu-item {% if '/projects' in request.path %}active{% endif %}"
                 data-url="/projects/" data-title="项目列表" data-icon="bi-folder" data-closable="true">
                <i class="bi bi-folder"></i>
                <span>项目列表</span>
            </div>
            <div class="menu-item {% if '/reviews' in request.path %}active{% endif %}"
                 data-url="/reviews/" data-title="审查任务" data-icon="bi-file-earmark-check" data-closable="true">
                <i class="bi bi-file-earmark-check"></i>
                <span>审查任务</span>
            </div>
            <div class="menu-divider"></div>
            <div class="menu-item" data-url="/admin/" data-title="管理后台" data-icon="bi-gear" data-closable="true">
                <i class="bi bi-gear"></i>
                <span>管理后台</span>
            </div>
        </nav>
    </aside>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 顶部导航栏 -->
        <header class="navbar">
            <div class="navbar-left">
                <button id="sidebarToggle" class="hamburger" title="切换菜单">
                    <i class="bi bi-list"></i>
                </button>
                <nav class="breadcrumb">
                    <div class="breadcrumb-item">
                        <a href="/" data-url="/">
                            <i class="bi bi-house"></i>
                        </a>
                    </div>
                    <div class="breadcrumb-item active" id="breadcrumbCurrent">{% block breadcrumb %}首页{% endblock %}</div>
                </nav>
            </div>
            <div class="navbar-right">
                <span class="text-muted small">v{{ app_version }}</span>
            </div>
        </header>

        <!-- 标签页导航 -->
        <div class="tags-nav">
            <div class="tags-list" id="tagsList">
                <!-- 标签项由 JS 动态生成 -->
            </div>
            <div class="tags-actions">
                <button id="refreshTag" class="tag-action" title="刷新当前标签">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
                <button id="closeAllTags" class="tag-action" title="关闭所有标签">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        </div>

        <!-- 主内容区 -->
        <main class="app-main">
            <div class="app-content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/app.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
