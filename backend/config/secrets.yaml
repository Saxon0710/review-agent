# Review Agent 密钥配置
# 此文件包含敏感信息，不应提交到版本控制系统
# 请复制此文件并根据实际情况修改

default:
  # ========== 安全密钥 ==========
  secret_key: "CHANGE_ME_IN_PRODUCTION_PLEASE_GENERATE_STRONG_SECRET_KEY"

  # ========== 数据库密码 ==========
  database:
    password: "CHANGE_ME_DB_PASSWORD"

  # ========== GitLab 凭证 ==========
  gitlab:
    # GitLab Personal Access Token (用于 API 调用)
    personal_access_token: "CHANGE_ME_GITLAB_TOKEN"

    # GitLab App 凭证 (如果使用 OAuth)
    app_id: "CHANGE_ME_GITLAB_APP_ID"
    app_secret: "CHANGE_ME_GITLAB_APP_SECRET"

    # Webhook 密钥 (用于验证 Webhook 请求)
    webhook_secret: "CHANGE_ME_WEBHOOK_SECRET"

  # ========== AI API 密钥 ==========
  ai:
    # OpenAI API Key
    openai_api_key: "CHANGE_ME_OPENAI_API_KEY"

    # Anthropic API Key
    anthropic_api_key: "CHANGE_ME_ANTHROPIC_API_KEY"

    # Azure OpenAI (可选)
    azure_openai_api_key: null
    azure_openai_endpoint: null
    azure_openai_deployment: null

    # Google AI (可选)
    google_api_key: null

    # Cohere (可选)
    cohere_api_key: null

  # ========== 第三方服务 (可选) ==========
  # Sentry 错误追踪
  sentry:
    dsn: null
    environment: "production"

  # Langfuse 可观测性
  langfuse:
    public_key: null
    secret_key: null
    host: "https://cloud.langfuse.com"

  # ========== 存储配置 ==========
  # S3 兼容存储 (用于日志、报告等)
  storage:
    access_key: null
    secret_key: null
    bucket: null
    endpoint: null  # 如使用 MinIO 自建存储
